# GOAL: runs the tests on every push

name: Run tests

on:
    push:

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup python
              uses: actions/setup-python@v6
              with:
                python-version: 3.11

            - name: Run tests
              run: |
                python test.py