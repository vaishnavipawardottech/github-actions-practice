# GOAL: create a caller workflow

name: call resuable build

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        uses: ./.github/workflows/reusable-workflow.yml
        with:
            app_name: "my-web-app"
            environment: "production"

        secrets:
            docker_token: ${{ secrets.DOCKER_TOKEN }}