# GOAL: build docker image

name: Docker publish

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    docker:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: docker setup
              uses: docker/setup-docker-action@v5

            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
