# Goal: Matrix build with multiple OS and python versions.

name: Matrix Build

on: 
  push:

jobs:
  test:
    strategy:
      # Allow all metrics jobs to continue even if one fails
      fail-fast: false

      matrix:
        # OS
        os: ['ubuntu-latest', 'windows-latest']

        # Python versions
        python-version: ['3.10', '3.11', '3.12']

        # Exclude 1 combination
        exclude:
          - os: windows-latest
            python-version: '3.10'
    
    steps: 
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: print python version
        run: python --version

      - name: print OS
        run: 'echo "Running on ${{ matrix.os }}"'

      - name: Intentionally fail for testing
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: exit 1