# Goal: create manual workflow that can be triggered by a user.

name: manual workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Enter environment name"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - stag
          - prod

jobs:
  manual-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print environment
        run: 'echo "Selected environment: ${{ inputs.environment }}"'
        