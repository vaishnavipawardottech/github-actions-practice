# GOAL: verify caching

name: caching

on:
    workflow_dispatch:

jobs:
    cache-demo:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: set up python
              uses: actions/setup-python@v6
              with:
                python-version: 3.11
                cache: "pip"

            - name: install dependencies
              run: pip install -r requirements.txt